<html>
    <head>
        <title>Styling With HTML Internal Styles</title>
        <style>
            body{
                background-color: white;
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
            }
            .container1{
                background-color: rgb(75, 185, 75);
                width: 900px;
                padding: 50px;
                margin: 25px auto;
                border-radius: 25px;
                text-align: center;
            }
            .container2{
                background-color: rgb(47, 171, 165);
                width: 900px;
                padding: 50px;
                margin: 25px auto;
                border-radius: 25px;
                text-align: center;
            }
            .life-img{
                text-align: center;
                border-radius: 30px;
            }
            #section1-h{
                color: darkgreen;
                font-size: 30px;
            }
            #section2-h{
                color: rgb(39, 5, 85);
                font-size: 30px;
            }
            #para1{
                color: rgb(183, 248, 201);
                font-size: 20px;
            }
            #para2{
                color: rgb(205, 225, 168);
                font-size: 20px;
            }
            .btn1{
                background-color: darkgreen;
                width: 240px;
                height: 40px;
                color: lightgray;
                border-color: white;
                border-radius: 30px;
            }
            .btn2{
                background-color: darkcyan;
                width: 240px;
                height: 40px;
                color: lightgray;
                border-color: white;
                border-radius: 30px;
            }
            div{
                background-color: darkgreen;
                width: 400px;
                height: 700px;
                margin: 50px auto;
                padding: 20px;
                text-align: cener;
            }
        </style>
    </head>
    <body>
        <div class = "container1">
            <img src = "life1.jpg" alt = "image" width = "700PX" height = "400PX" class = "life-img">
            <h3 id = "section1-h">Welcome to Innovation Meetup</h3>
            <p id = "para1">Join here to learn about the latest innovations!</p>
            <button class = "btn1">Join Now</button>
        </div>

        <div class = "container2">
            <img src = "life3.jpg" alt = "image" width = "700PX" height = "400PX" class = "life-img">
            <h3 id = "section2-h">Welcome to Innovation Meetup</h3>
            <p id = "para2">Join here to learn about the latest innovations!</p>
            <button class = "btn2">Join Now</button>
        </div>
    </body>
</html>
